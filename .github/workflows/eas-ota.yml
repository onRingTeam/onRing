name: EAS OTA Update (preview)

# dev 에 앱 변경이 push 되면 preview 채널로 OTA(JS) 업데이트 자동 발행.
# Actions 탭 > 이 워크플로우 > "Run workflow" 버튼으로 수동 실행도 가능.
# 필요 시크릿: EXPO_TOKEN (expo.dev > Access tokens)
on:
  push:
    branches: [dev]
    paths: ['app/knou-app/**']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/knou-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/knou-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        run: npx eas-cli update --branch preview --environment preview --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
