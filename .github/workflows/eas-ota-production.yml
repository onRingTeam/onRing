name: EAS OTA Update (production)

# main 에 앱 변경이 push 되면 production 채널로 OTA(JS) 업데이트 자동 발행.
# eas-ota.yml(dev → preview) 과 동일 구조, 대상 브랜치/채널/environment 만 production.
# Actions 탭 > 이 워크플로우 > "Run workflow" 버튼으로 수동 실행도 가능.
# 필요 시크릿: EXPO_TOKEN (expo.dev > Access tokens)
on:
  push:
    branches: [main]
    paths: ['app/knou-app/**', '.github/workflows/eas-ota-production.yml']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/knou-app
    steps:
      - uses: actions/checkout@v5

      # 로컬 개발 환경(node 24 / npm 11)과 동일하게 — package-lock 이 npm 11 기준이라
      # npm 10(node 22)의 `npm ci` 검증이 실패함 (typescript 중첩 항목 해석 차이)
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/knou-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        run: npx eas-cli update --branch production --environment production --auto --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
