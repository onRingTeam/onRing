# JPA 통합 테스트 전용 프로필.
# 실제 개발 DB(SQLite dev 파일 / MySQL onRingDb)를 건드리지 않도록 격리된 테스트 DB에 붙는다.
# 엔티티로 스키마를 직접 생성(create-drop)하므로 어떤 DB든 사전 스키마 없이 통과한다.
spring:
  datasource:
    # 격리된 테스트용 SQLite 파일. 테스트 끝나면 drop 되고 파일은 재사용됨.
    url: jdbc:sqlite:./data/test.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 테스트마다 엔티티 기준으로 스키마 생성 → 종료 시 삭제. 개발 데이터와 격리.
      ddl-auto: create-drop
    show-sql: true

# 요약/소셜 로그인 등 외부 키는 테스트에서 불필요 — 빈 값으로 컨텍스트만 뜨게 함
jwt:
  secret: test-secret-key-please-change-0123456789
supabase:
  url: ""
  anon-key: ""
gemini:
  api-key: ""
