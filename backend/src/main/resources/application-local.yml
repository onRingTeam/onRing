spring:
  datasource:
    # SQLite 파일 DB. 앱을 꺼도 데이터 유지됨. 파일은 실행 위치 기준 ./data/knou.db 에 생성.
    # 사용자는 DB 를 따로 띄우거나 env 를 설정할 필요 없이 앱만 실행하면 됨.
    url: jdbc:sqlite:./data/knou.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 는 단일 파일 락 기반이라 커넥션 풀을 1로 두는 게 안전
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 엔티티 기준으로 스키마 자동 생성/갱신 → 별도 DDL 실행 불필요
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.knou.api: DEBUG
