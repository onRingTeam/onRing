spring:
  datasource:
    url: jdbc:mysql://localhost:33306/onRingDb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 9999

logging:
  level:
    root: WARN
    com.knou.api: INFO
