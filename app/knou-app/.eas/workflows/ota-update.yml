# dev 브랜치에 push 될 때마다 preview 채널로 OTA(JS) 업데이트 자동 발행.
# expo.dev 대시보드 > Workflows 에서 "Run workflow" 버튼으로 수동 실행도 가능.
# ⚠️ 최초 1회 expo.dev > 프로젝트 Settings > GitHub 에서 저장소 연동 필요.
name: OTA 업데이트 (preview)

on:
  push:
    branches: ['dev']

jobs:
  publish_update:
    name: eas update → preview
    type: update
    params:
      branch: preview
